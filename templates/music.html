{% extends "base.html" %}

{% block title %}Search Music{% endblock %}

{% block content %}
<h1>Search Music</h1>
<form method="post">
    <label>Track name:</label>
    <input type="text" name="track" placeholder="Enter track name" required>
    <label>Artist's name:</label>
    <input type="text" name="artist" placeholder="Enter artist name" required>
    <button type="submit">Search</button>
</form>

{% if results %}
<h2>Results:</h2>
<table>
    <tr>
        <th>Track Name</th>
        <th>Album Name</th>
    </tr>
    {% for track, album in results %}
    <tr>
        <td>{{ track }}</td>
        <td>{{ album }}</td>
    </tr>
    {% endfor %}
</table>
{% elif searched %}
<p>No music found.</p>
{% endif %}

<br><a href="/">Back</a>
{% endblock %}
