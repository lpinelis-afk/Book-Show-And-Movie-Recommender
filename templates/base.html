<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smith's Recommendations{% endblock %}</title>
    <style>
        @font-face {
            font-family: 'Shadowed RDF';
            src: url('/static/fonts/Shadowed RDF Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Kinesthesia';
            src: url('/static/fonts/Kinesthesia-SemiBold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin: 0;
            padding: 20px;
            font-family: 'Shadowed RDF', Arial, sans-serif;
            font-size: 18px;
            line-height: 1.6;
            background-color: #000;
            color: #fff;
            box-sizing: border-box;
        }
        h1, h2, th, label, strong, button {
            font-family: 'Kinesthesia', 'Shadowed RDF', Arial, sans-serif;
        }
        h1 {
            font-size: 4rem;
        }
        h2 {
            font-size: 3.2rem;
        }
        table { border-collapse: collapse; margin: 20px 0; width: 100%; }
        th, td { border: 1px solid #555; padding: 12px 10px; text-align: left; }
        th { background-color: #333; color: #fff; font-size: 1.1rem; }
        td { background-color: #111; font-size: 1rem; }
        a { color: #0337e2; text-decoration: none; }
        a:hover { text-decoration: underline; }
        form { margin: 20px 0; }
        label { display: block; margin-top: 14px; font-weight: bold; font-size: 1.05rem; }
        input, select { padding: 10px; margin-top: 5px; background: #111; border: 1px solid #444; color: #fff; font-size: 1rem; border-radius: 20px; position: relative; overflow: hidden; transition: border-color 0.3s ease; }
        input:hover, select:hover { border-color: #005a17; }
        button { padding: 10px 18px; background-color: #444; color: #fff; border: 1px solid #666; cursor: pointer; font-size: 1rem; border-radius: 20px; position: relative; overflow: hidden; transition: border-color 0.3s ease; }
        button:hover { background-color: #555; border-color: #005a17; }
        ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        li { display: inline-block; }
        ul a { display: block; padding: 15px 30px; background-color: #222; border: 2px solid #444; border-radius: 30px; transition: all 0.3s ease; text-align: center; min-width: 120px; }
        ul a:hover { background-color: #333; border-color: #005a17; text-decoration: none; box-shadow: 0 0 15px rgba(102, 204, 255, 0.5); }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
