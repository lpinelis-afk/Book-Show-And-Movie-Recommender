<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smith's Recommendations{% endblock %}</title>
    <style>
        @font-face {
            font-family: 'Shadowed RDF';
            src: url('/static/fonts/Shadowed RDF Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Kinesthesia';
            src: url('/static/fonts/Kinesthesia-SemiBold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin: 0;
            padding: 20px;
            font-family: 'Shadowed RDF', Arial, sans-serif;
            font-size: 18px;
            line-height: 1.6;
            background-color: #000;
            color: #fff;
            box-sizing: border-box;
        }
        h1, h2, th, label, strong, button {
            font-family: 'Kinesthesia', 'Shadowed RDF', Arial, sans-serif;
        }

        h1 {
            color: #000000;
            font-size: 4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(to right, #ff910063, #ff000063); 
            
            /* 2. Clip the background to the text area */
            -webkit-background-clip: text;
            background-clip: text;

            /* 3. Create a transparent stroke */
            -webkit-text-stroke: 4px transparent; 
            
            /* 4. Match text color to your page background (hides the fill) */
        }
        h2 {
            font-size: 3.2rem;
        }

        table { border-collapse: collapse; margin: 20px 0; width: 100%; }
        th, td { border: 1px solid #555; padding: 12px 10px; text-align: left; }
        th { background-color: #333; color: #fff; font-size: 1.1rem; }
        td { background-color: #111; font-size: 1rem; }
        a { 
            color: #0e4600; text-decoration: none;
            font-size: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-shadow: 
                -0.1px -0.1px 0 #ffffff,  
                0.1px -0.1px 0 #ffffff,
                -0.1px  0.1px 0 #ffffff,
                0.1px  0.1px 0 #ffffff; 
        
        }
        form { margin: 20px 0; }
        label { display: block; margin-top: 14px; font-weight: bold; font-size: 1.05rem; }
        input, select { padding: 10px; margin-top: 5px; background: #111; border: 1px solid #005a17; color: #fff; font-size: 1rem; border-radius: 20px; position: relative; overflow: hidden; transition: border-color 0.3s ease; }
        select { -webkit-appearance: none; -moz-appearance: none; appearance: none; background-color: #111; padding-right: 40px; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23005a17' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 10px center; background-size: 20px; }
        input:hover, select:hover { border-color: #005a17; }
        button { padding: 10px 18px; background-color: #444; color: #fff; border: 1px solid #666; cursor: pointer; font-size: 1rem; border-radius: 20px; position: relative; overflow: hidden; transition: border-color 0.3s ease; }
        button:hover { background-color: #555; border-color: #005a17; }
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.65;
        }
        ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        li { display: inline-block; }
        ul a { display: block; padding: 15px 30px; background-color: #222; border: 2px solid #444; border-radius: 30px; transition: all 0.3s ease; text-align: center; min-width: 120px; }
        ul a:hover { background-color: #333; border-color: #005a17; text-decoration: none; box-shadow: 0 0 15px rgba(102, 204, 255, 0.5); }

    </style>
</head>
<body>
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="/static/videos/Background.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <main id="page-content">
        {% block content %}{% endblock %}
    </main>

    <script>
        (function() {
            const pageContent = document.getElementById('page-content');

            function initSearchPage() {
                const categorySelect = document.getElementById('category');
                if (!categorySelect) return;

                const queryField = document.getElementById('query-field');
                const queryLabel = document.getElementById('query-label');
                const queryInput = document.getElementById('query-input');
                const musicFields = document.getElementById('music-fields');

                function updateQueryLabel() {
                    const category = categorySelect.value;
                    let labelText = 'Enter the search term for the selected category:';
                    let placeholderText = 'Enter search term for selected category';

                    switch (category) {
                        case 'book':
                            labelText = 'Enter a book title:';
                            placeholderText = 'Enter book title';
                            break;
                        case 'show':
                            labelText = 'Enter a show title:';
                            placeholderText = 'Enter show title';
                            break;
                        case 'movie':
                            labelText = 'Enter a movie title:';
                            placeholderText = 'Enter movie title';
                            break;
                        case 'games':
                            labelText = 'Enter a game title:';
                            placeholderText = 'Enter game title';
                            break;
                        case 'boardgames':
                            labelText = 'Enter a board game mechanic:';
                            placeholderText = 'Enter board game mechanic';
                            break;
                        default:
                            labelText = 'Enter the search term for the selected category:';
                            placeholderText = 'Enter search term for selected category';
                    }

                    queryLabel.textContent = labelText;
                    queryInput.placeholder = placeholderText;
                }

                function updateFields() {
                    if (categorySelect.value === 'music') {
                        queryField.style.display = 'none';
                        musicFields.style.display = 'block';
                        musicFields.querySelector('input[name="track"]').required = true;
                        musicFields.querySelector('input[name="artist"]').required = true;
                        queryInput.required = false;
                    } else {
                        queryField.style.display = 'block';
                        musicFields.style.display = 'none';
                        musicFields.querySelector('input[name="track"]').required = false;
                        musicFields.querySelector('input[name="artist"]').required = false;
                        queryInput.required = true;
                    }
                    updateQueryLabel();
                }

                categorySelect.addEventListener('change', updateFields);
                updateFields();
            }

            function initializePage() {
                initSearchPage();
            }

            async function loadPage(url, fetchOptions = {}, pushState = true) {
                const response = await fetch(url, fetchOptions);
                if (!response.ok) {
                    throw new Error('Failed to load page');
                }

                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const newContent = doc.getElementById('page-content');

                if (!newContent) {
                    throw new Error('Page content not found');
                }

                pageContent.innerHTML = newContent.innerHTML;
                document.title = doc.title;

                if (pushState) {
                    window.history.pushState({}, '', url);
                }

                initializePage();
            }

            document.addEventListener('click', function(event) {
                if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                    return;
                }

                const anchor = event.target.closest('a');
                if (!anchor) return;
                const href = anchor.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:') || anchor.target) return;

                const url = new URL(href, window.location.href);
                if (url.origin !== window.location.origin) return;

                event.preventDefault();
                loadPage(url.href).catch(() => { window.location.href = url.href; });
            });

            document.addEventListener('submit', function(event) {
                const form = event.target.closest('form');
                if (!form) return;

                const action = form.action || window.location.href;
                const url = new URL(action, window.location.href);
                if (url.origin !== window.location.origin) return;

                event.preventDefault();
                const formData = new FormData(form);
                const method = (form.method || 'GET').toUpperCase();

                if (method === 'GET') {
                    const params = new URLSearchParams(formData);
                    const queryString = params.toString();
                    const fetchUrl = queryString ? `${url.pathname}?${queryString}` : url.pathname;
                    loadPage(fetchUrl).catch(() => { form.submit(); });
                } else {
                    loadPage(url.href, {
                        method: 'POST',
                        body: formData,
                        headers: {
                            'X-Requested-With': 'XMLHttpRequest'
                        }
                    }).catch(() => { form.submit(); });
                }
            });

            window.addEventListener('popstate', function() {
                loadPage(window.location.href, {}, false).catch(() => { window.location.reload(); });
            });

            document.addEventListener('DOMContentLoaded', initializePage);
        })();
    </script>
</body>
</html>
